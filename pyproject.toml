[project]
name = "genai-interview"
version = "0.1.0"
description = "Full Stack GenAI interview prep + hands-on practice"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv>=1.0",
  "pydantic>=2.0",
  "httpx>=0.27",
  "pytest>=8.0",
  "fastapi>=0.142.2",
  "sqlalchemy>=2.1.1",
  "python-multipart>=0.0.32",
  "pydantic-settings>=2.15.0",
  "pyjwt>=2.15.1",
  "cryptography>=50.0.2",
  "fakeredis>=2.38.0",
  "cachetools>=7.2.0",
]

[dependency-groups]
dev = [
  "ruff>=0.6",
  "mypy>=1.10",
  "pytest-cov>=5.0",
  "pre-commit>=3.0",
  "jupyter>=1.0",
]
# GenAI extras - install per-topic as needed, keeps base env light:
# uv add openai anthropic langchain langgraph llama-index sentence-transformers
# uv add qdrant-client chromadb pgvector redis kafka-python-ng
# uv add ragas deepeval promptfoo (via npm for promptfoo)

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

# B008 flags function calls in defaults — but Depends() in defaults IS the FastAPI idiom.
[tool.ruff.lint.per-file-ignores]
"topics/03-backend-frameworks/**/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["."]
python_files = ["test_*.py", "*_test.py"]

[tool.coverage.run]
omit = ["*/.venv/*", "*/tests/*"]
